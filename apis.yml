aid: rigetti-computing
name: Rigetti Computing
description: >-
  Rigetti Computing is a full-stack quantum computing company that builds
  superconducting quantum processors and delivers access to them through
  Quantum Cloud Services (QCS). Developers program Rigetti quantum processing
  units (QPUs) with the Quil quantum instruction language via the open-source
  pyQuil SDK, compile with quilc, and simulate locally with the Quantum Virtual
  Machine (QVM). The QCS HTTP API (api.qcs.rigetti.com) exposes REST-style
  operations for quantum processors, instruction set architectures, engagements,
  endpoints, reservations, groups, billing, and account management, secured with
  OAuth2 (Okta) JWT bearer tokens. This profile was seeded as a VC-portfolio
  lead and enriched by the API Evangelist pipeline from Rigetti's public QCS
  OpenAPI, SDKs, and developer documentation.
